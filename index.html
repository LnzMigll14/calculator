<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, keyboard-friendly calculator by LnzMigll."
    />

    <title>Calculator | LnzMigll</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <main class="page">
      <section class="calculator" aria-labelledby="calculator-title">
        <!-- Calculator header -->
        <header class="calculator__header">
          <div class="calculator__heading">
            <h1 class="calculator__title" id="calculator-title">Calculator</h1>
            <p class="calculator__brand">lnzmigll.dev</p>
          </div>

          <button
            class="theme-toggle"
            type="button"
            aria-label="Switch to light theme"
            aria-pressed="false"
          >
            <span class="theme-toggle__track" aria-hidden="true">
              <span class="theme-toggle__thumb"></span>
            </span>
            <span class="theme-toggle__label">Light</span>
          </button>
        </header>

        <!-- Main calculator controls -->
        <section
          class="calculator__controls"
          aria-label="Calculator controls"
        >
          <div class="calculator__screen">
            <div class="calculator__status">
              <p
                class="calculator__status-message"
                id="calculator-status"
                role="status"
                aria-live="polite"
              >
                Ready
              </p>

              <button
                class="calculator__delete-button"
                type="button"
                data-key="Backspace"
                data-action="delete"
                aria-label="Delete last digit"
              >
                Del
              </button>
            </div>

            <div class="calculator__display">
              <!-- aria-live announces updated results to screen readers. -->
              <output
                class="calculator__result"
                id="calculator-output"
                aria-label="Calculator result"
                aria-live="polite"
                aria-atomic="true"
              >
                0
              </output>

              <div
                class="calculator__display-info"
                aria-label="Calculator input status"
              >
                <span>Input / Decimal</span>
                <span>Keys / Active</span>
              </div>
            </div>
          </div>

          <!-- Calculator keypad -->
          <div
            class="calculator__keypad"
            role="group"
            aria-label="Calculator keypad"
          >
            <!--
              JavaScript reads data-action to choose a behavior and data-value
              to get the digit or operator associated with a button.
            -->
            <!-- Utility keys -->
            <button
              class="calculator__key calculator__key--utility"
              type="button"
              data-key="Escape"
              data-action="clear"
              aria-label="Clear calculator"
            >
              AC
            </button>
            <button
              class="calculator__key calculator__key--utility"
              type="button"
              data-key="sign"
              data-action="sign"
              aria-label="Toggle positive or negative"
            >
              &plusmn;
            </button>
            <button
              class="calculator__key calculator__key--utility"
              type="button"
              data-key="percent"
              data-action="percent"
              aria-label="Percentage"
            >
              %
            </button>
            <button
              class="calculator__key calculator__key--operator"
              type="button"
              data-key="/"
              data-action="operator"
              data-value="/"
              aria-label="Divide"
            >
              &divide;
            </button>

            <!-- Number keys: 7 to 9 -->
            <button
              class="calculator__key"
              type="button"
              data-key="7"
              data-action="digit"
              data-value="7"
            >
              7
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="8"
              data-action="digit"
              data-value="8"
            >
              8
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="9"
              data-action="digit"
              data-value="9"
            >
              9
            </button>
            <button
              class="calculator__key calculator__key--operator"
              type="button"
              data-key="*"
              data-action="operator"
              data-value="*"
              aria-label="Multiply"
            >
              &times;
            </button>

            <!-- Number keys: 4 to 6 -->
            <button
              class="calculator__key"
              type="button"
              data-key="4"
              data-action="digit"
              data-value="4"
            >
              4
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="5"
              data-action="digit"
              data-value="5"
            >
              5
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="6"
              data-action="digit"
              data-value="6"
            >
              6
            </button>
            <button
              class="calculator__key calculator__key--operator"
              type="button"
              data-key="-"
              data-action="operator"
              data-value="-"
              aria-label="Subtract"
            >
              &minus;
            </button>

            <!-- Number keys: 1 to 3 -->
            <button
              class="calculator__key"
              type="button"
              data-key="1"
              data-action="digit"
              data-value="1"
            >
              1
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="2"
              data-action="digit"
              data-value="2"
            >
              2
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="3"
              data-action="digit"
              data-value="3"
            >
              3
            </button>
            <button
              class="calculator__key calculator__key--operator"
              type="button"
              data-key="+"
              data-action="operator"
              data-value="+"
              aria-label="Add"
            >
              +
            </button>

            <!-- Bottom row -->
            <button
              class="calculator__key calculator__key--zero"
              type="button"
              data-key="0"
              data-action="digit"
              data-value="0"
            >
              0
            </button>
            <button
              class="calculator__key"
              type="button"
              data-key="."
              data-action="decimal"
              aria-label="Decimal point"
            >
              .
            </button>
            <button
              class="calculator__key calculator__key--equals"
              type="button"
              data-key="="
              data-action="equals"
              aria-label="Equals"
            >
              =
            </button>
          </div>
        </section>

        <!-- Recent calculations -->
        <aside class="history-panel" aria-labelledby="history-title">
          <header class="history-panel__header">
            <h2 class="history-panel__title" id="history-title">History</h2>
            <span class="history-panel__subtitle">Last three</span>
          </header>

          <div class="history-panel__content">
            <p class="history-panel__empty-message">No calculations yet.</p>
          </div>

          <footer class="history-panel__footer">
            <p class="history-panel__shortcut">
              <kbd>Enter</kbd> equals / <kbd>Esc</kbd> clears
            </p>
          </footer>
        </aside>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
